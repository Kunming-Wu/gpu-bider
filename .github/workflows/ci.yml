name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.11", "3.12"]
        exclude:
          # macos-latest is arm64; 3.8 installers are not published for it
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies to install: the tool is stdlib-only by design, and
      # these two suites never touch a real GPU.
      - name: selftest
        run: python bider.py selftest

      - name: end-to-end
        run: python test_e2e.py

      - name: entry point still imports cleanly
        run: python -c "import bider; print(bider.VERSION)"

      - name: package builds
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'

  diagnostics:
    name: installer is honest about a machine with no GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # There is no NVIDIA card on a CI runner, so the installer must report
      # that plainly rather than pretending.  Exit code 1 is the correct
      # outcome here, and a crash is not.
      - name: install --check should fail cleanly, not traceback
        run: |
          set +e
          out=$(python install.py --check 2>&1)
          rc=$?
          echo "$out"
          echo "exit=$rc"
          test $rc -eq 1
          echo "$out" | grep -q "nvidia-smi"
