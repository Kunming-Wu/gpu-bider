[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-bider"
version = "2.0.0"
description = "A polite GPU job queue: wait for the card, never take anybody else's."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["gpu", "queue", "scheduler", "nvidia", "shared-server", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# psutil makes ETA estimates for *other people's* jobs work (it can list the
# log files a process has open).  Everything else works without it.
eta = ["psutil>=5.8"]
dev = ["pytest>=7"]

[project.scripts]
bider = "bider:main"

[project.urls]
Homepage = "https://github.com/wkmallmx/gpu-bider"
Issues = "https://github.com/wkmallmx/gpu-bider/issues"
Changelog = "https://github.com/wkmallmx/gpu-bider/releases"

[tool.setuptools]
py-modules = ["bider"]
