<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="gpu-bider">
  <title>gpu-bider</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>

  <!-- the card -->
  <rect x="10" y="18" width="108" height="78" rx="12" fill="url(#board)"/>

  <!-- slot dividers on the board -->
  <g stroke="#cde2fb" stroke-opacity="0.30" stroke-width="2">
    <line x1="46" y1="30" x2="46" y2="84"/>
    <line x1="82" y1="30" x2="82" y2="84"/>
  </g>

  <!-- edge contacts: the card, not a screen -->
  <g stroke="#86b6ef" stroke-width="3" stroke-linecap="round">
    <line x1="26" y1="96" x2="26" y2="108"/>
    <line x1="42" y1="96" x2="42" y2="108"/>
    <line x1="58" y1="96" x2="58" y2="108"/>
    <line x1="74" y1="96" x2="74" y2="108"/>
    <line x1="90" y1="96" x2="90" y2="108"/>
    <line x1="106" y1="96" x2="106" y2="108"/>
  </g>

  <!-- memory bars: the thing being waited for -->
  <g>
    <rect x="22" y="34" width="16" height="46" rx="4" fill="#cde2fb" fill-opacity="0.42"/>
    <rect x="58" y="34" width="16" height="46" rx="4" fill="#cde2fb" fill-opacity="0.42"/>
    <rect x="94" y="34" width="16" height="46" rx="4" fill="#cde2fb" fill-opacity="0.42"/>
  </g>

  <!-- one slot free, and marked -->
  <rect x="58" y="34" width="16" height="46" rx="4" fill="#fcfcfb" fill-opacity="0.14"/>

  <!-- the dot that says "this one, now" -->
  <circle cx="66" cy="57" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/>
</svg>
